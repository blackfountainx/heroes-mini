# HeroesMini configuration
# Number of Special Hearts every player starts with
start-hearts: 3
# Combat timer in seconds, refreshed by every PvP hit
combat-seconds: 20
# Radius searched for a safe grave spot when the death location is unsafe (lava, water, air, void)
grave-safe-radius: 6
# Duration of the PvP protection phase at the start of an event, in seconds (900 = 15 minutes)
protection-seconds: 900
# Forbidden items during the event (Mace, Enchanted Golden Apple, Mending). true = enforced.
ban-forbidden-items: true
# Grappling hook
hook-max-range: 90
hook-iron-uses: 100
hook-diamond-uses: 165
