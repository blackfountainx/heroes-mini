name: HeroesMini
version: ${version}
main: ai.bfsx.heroes.HeroesPlugin
api-version: '1.21'
description: Minecraft Heroes Mini - Special Hearts, Combat timer, Graves. Last man standing.
authors: [Selim, Black Fountain]

commands:
  hero:
    description: Admin commands for the Heroes Mini event
    usage: /hero <start|stop|reset|hearts|revive|graves|combat|protection [end]>
    permission: heroes.admin
    aliases: [heroes]

permissions:
  heroes.admin:
    description: Manage the Heroes Mini event
    default: op
